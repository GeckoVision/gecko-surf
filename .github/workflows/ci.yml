name: ci

# Enforce the repo's mandatory local workflow (ruff + mypy + pytest) as a merge gate.
# release.yaml only fires on `v*` tags, so without THIS a red lint/type/test could merge
# unnoticed. Lint/type/test ONLY — no PyInstaller build, no publish (those stay tag-gated
# in release.yaml). Mirrors `.claude/rules/python.md`, using `--check` (not `--fix`) so the
# gate is read-only and fails on drift instead of silently repairing it.

on:
  pull_request:
  push:
    branches: [main]

# One in-flight run per PR/branch; a newer push cancels the older run (fast feedback, less
# queue). head_ref groups all pushes of a PR together; on a branch push it falls back to ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: lint / type / test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pin the interpreter to the project floor (pyproject requires-python >=3.11); uv
      # auto-provisions a managed 3.11 during `uv sync`.
      UV_PYTHON: "3.11"
      # The four gate steps reuse the venv the sync step builds; `uv run` must never re-sync
      # or mutate it (this does NOT affect the explicit `uv sync` below).
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4

      # uv drives everything, matching how the project runs locally. enable-cache keys the uv
      # cache on the committed uv.lock, so unchanged deps restore instead of re-download.
      - name: Set up uv (+ cache)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `serve` is the one extra the suite needs: two tests import starlette at module scope
      # (it arrives transitively via mcp[cli]) and ERROR on collection without it. dense/events
      # are NOT required — the suite injects fakes for pymongo/anthropic — so serve-only
      # reproduces the exact local green (1192 passed, 1 skipped: tiktoken, which is in no
      # extra) without the heavier installs. `uv sync` installs the `dev` group by default, so
      # ruff/mypy/pytest come with it — every gate step runs from this one sync.
      - name: Install (serve extra + dev group)
        run: uv sync --extra serve

      # The four mandatory gates (.claude/rules/python.md). Any one red fails the PR.
      - name: ruff format --check
        run: uv run ruff format --check .

      - name: ruff check
        run: uv run ruff check .

      - name: mypy gecko
        run: uv run mypy gecko

      - name: pytest
        run: uv run pytest -q

  # The BLINDING CANARY. Separate job because it needs the [ocr] extra, which the main
  # gate deliberately does not install (the base install must stay green without it).
  #
  # Why this job exists at all: an OCR model is not human-reviewable. Someone who can
  # alter the language data can blind the scanner without touching a line of Python —
  # make the model return empty text and every rendered attack reads as CLEAN, with no
  # exception, no error and no coverage gap, because the channel WAS read. Every other
  # imagescan test injects a fake OCR seam, so they all keep passing against a blinded
  # model. A red build here is the only signal we would ever get.
  #
  # GECKO_REQUIRE_OCR=1 makes a missing engine FAIL rather than skip — otherwise a
  # broken install turns the canary into a no-op and the job goes green protecting
  # nothing.
  ocr-canary:
    name: blinding canary (L3 OCR)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_PYTHON: "3.11"
      GECKO_REQUIRE_OCR: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv (+ cache)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # No apt-get install tesseract. That absence is the point: tesserocr's manylinux
      # wheel carries libtesseract + leptonica and gecko/tessdata/ carries the language
      # data, so this step also continuously proves the [ocr] extra is self-contained.
      # If that ever stops being true, this job fails on the ocr_backend() assertion.
      - name: Install (ocr extra, NO system tesseract)
        run: uv sync --extra ocr

      - name: Verify no system tesseract is present
        run: |
          if command -v tesseract >/dev/null 2>&1; then
            echo "::error::A system tesseract is on PATH — this job must prove the"
            echo "::error::[ocr] extra is self-contained, so the runner must not have one."
            exit 1
          fi
          echo "confirmed: no tesseract binary on PATH"

      - name: Blinding canary + vendored-data hash
        run: uv run pytest tests/test_ocr_engine.py -q

      # The recall corpus ships in its own PR. Guarded so this job is green on whichever
      # of the two lands first; drop the guard once both are on main.
      - name: OCR recall corpus
        run: |
          if [ -f tests/test_ocr_recall_corpus.py ]; then
            uv run pytest tests/test_ocr_recall_corpus.py -q
          else
            echo "recall corpus not present on this ref (lands in the corpus PR)"
          fi

  # The CODE GRAPH. Separate job because it needs node, not uv, and because it must never
  # gate a merge on an advisory signal.
  #
  # WHY THIS EXISTS. `graphify-out/` is gitignored, so the graph is rebuilt locally by
  # whoever needs it — and a locally-rebuilt artifact is exactly the kind that goes stale
  # without anyone noticing. It bit us: an index two days old reported `gate_surface_tool`
  # and `verify_handoff` as having no production callers. Both were true when it was built
  # and false by the time it was read, and the wrong answer was indistinguishable from a
  # right one. This job cannot keep a developer's local copy fresh (nothing is committed to
  # compare against), so it does the two things CI actually can:
  #
  #   1. proves the extraction still works on main — catching the day it silently breaks,
  #      which is the failure that would make every future graph answer quietly wrong;
  #   2. publishes a fresh graph as an artifact, so anyone can download today's rather
  #      than trusting whatever their laptop built last week.
  #
  # `update --no-cluster` is deliberate: no LLM, no API key, deterministic, and fast.
  # Clustering and community labelling are the parts that need a model; navigation and
  # reachability do not.
  code-graph:
    name: code graph (advisory)
    runs-on: ubuntu-latest
    # Advisory ONLY. A structural insight must never block a correctness fix — and a gate
    # nobody can turn off is a gate people learn to route around.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # graphify is a PYTHON tool on PyPI as `graphifyy` (double y) — not an npm package.
      # The first version of this job assumed node and failed with `graphify: command not
      # found`, which is what guessing an ecosystem instead of checking one costs.
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install graphify
        run: |
          uv tool install graphifyy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Fail loudly here rather than three steps later with a confusing error.
      - name: Confirm graphify is on PATH
        run: graphify --help > /dev/null

      # Re-extract from the code that is actually on this ref. Fails loudly if extraction
      # breaks; that failure is the signal worth having.
      - name: Rebuild the graph
        run: graphify update . --no-cluster

      # Same-endpoint edge collapse silently merges distinct relationships into one, which
      # would make `affected` and `path` answer confidently and wrongly — the exact class
      # of defect this repo keeps finding in its own controls.
      - name: Diagnose edge collapse
        run: graphify diagnose multigraph --json || true

      # Cohesion signal, printed not enforced. AgentApiClient was degree 526 against a
      # next-highest of 164 when this landed; that is a fact worth seeing on every merge,
      # not a rule worth failing on.
      - name: Architectural hubs
        run: graphify god-nodes --top 10 || true

      - name: Publish the graph
        uses: actions/upload-artifact@v4
        with:
          name: code-graph-${{ github.sha }}
          path: graphify-out/graph.json
          retention-days: 14
          if-no-files-found: warn
