[project]
name = "gecko-surf"
version = "0.9.5"
description = "Make any API agent-usable without integration code. V1: comprehension layer — turn a human-shaped OpenAPI surface into question-shaped, first-call-correct agent tools. (Working name; rename on brand pick.)"
# README becomes the PyPI long-description; it carries the `mcp-name:` marker the
# MCP Registry matches to prove PyPI ownership. Without this, the description is empty.
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
# keyring is a BASE dependency (decision #4): the credential resolver's KeyringBackend is
# the default secure store, so a plain install must be able to `import keyring` — the
# env-var fallback stays, but the OS-keychain path is no longer an opt-in extra.
dependencies = ["pyyaml>=6.0", "keyring>=25"]

# `uvx gecko ...` (dist: gecko-surf). Thin subcommand dispatcher (serve/test/
# from-docs); a bare `gecko <spec>` still serves. `python -m gecko.serve` also works
# unchanged. The entry only parses args + formats output (logic lives in the package).
[project.scripts]
gecko = "gecko.cli:_run"
# Bundled ready-to-use example surface — serve the Colosseum Copilot API (BYOK via
# COLOSSEUM_COPILOT_PAT). Ships in the package, so `uvx --from "gecko-surf[serve]"
# colosseum-mcp` needs NO local file.
colosseum-mcp = "gecko.examples.colosseum:main"
# Bundled ready-to-use example surface — serve the Jupiter Swap API. Public/keyless by
# default (free tier via lite-api.jup.ag); set JUPITER_API_KEY for the Pro host. Ships
# in the package, so `uvx --from "gecko-surf[serve]" jupiter-mcp` needs NO local file.
jupiter-mcp = "gecko.examples.jupiter:main"
# Bundled ready-to-use example surface — serve the TxLINE off-chain API (TxODDS).
# Two-token auth (Bearer JWT + X-Api-Token) sealed via `gecko auth set txline
# --account httpAuth|apiKeyAuth`. Ships in the package, so `uvx --from
# "gecko-surf[serve]" txline-mcp` (and `npx @geckovision/gecko txline-mcp`) needs
# NO local file and NO spec URL.
txline-mcp = "gecko.examples.txline:main"
# Bundled ready-to-use surface — serve the ORE program's instruction↔PDA graph. ORE is a
# Steel-framework Solana program (no Anchor IDL), so its PDA seed recipes live only in
# source; Gecko comprehends the bundled slice into first-call-correct derive/plan tools.
# Keyless, never signs. `uvx --from "gecko-surf[serve]" ore-mcp` needs NO local file.
ore-mcp = "gecko.examples.ore:main"
# The Gecko × Orquestra provider surface — the agent front door for any Orquestra program.
# Entry = the PROVIDER, program = a parameter (per-provider model, not a mount each): an
# agent plans in plain English, Gecko derives the PDAs Orquestra can't (helper-seeded roots
# its IDL drops) + the rest, and the plan points at Orquestra's builder. Keyless, never signs.
#   uvx --from "gecko-surf[serve,solana]" gecko-orquestra --program meteora
gecko-orquestra = "gecko.providers.cli:main"
# DEPRECATED alias for `gecko-orquestra --program meteora` (kept so the 0.9.2 command works).
meteora-demo = "gecko.providers.meteora:main"
# Serve a Solana program's instruction↔PDA graph over MCP (Streamable-HTTP or stdio)
# from a local Anchor IDL and/or Rust source — the recovered seeds an IDL/llms.txt
# loses, projected into first-call-correct derive/plan tools. Keyless. Needs [serve].
program-mcp = "gecko.program_mcp:main"
gecko-testgen = "gecko.testgen:_run"
# Off-chain battle-test: run the 12 packaged scenarios, gate on the scorecard (exit 0
# iff money_trusted). Deterministic $0 CI lane; `python -m gecko.redteam` works too.
gecko-redteam = "gecko.redteam.__main__:_run"
# Read-only local usage aggregate for a corpus JSONL (no network). Opt-out
# telemetry's inspection face; phone-home stays opt-in/disabled in gecko.telemetry.
gecko-telemetry = "gecko.telemetry:_run"

[project.optional-dependencies]
serve = [
    # Capped <2: mcp 2.0.0 removed the low-level `Server.list_tools`/`call_tool`
    # decorators our serve path uses (gecko.mcp_server / gecko.http_server), so an
    # UNPINNED install (the PyInstaller binary + `uvx`/`pip`, which don't read uv.lock)
    # resolved 2.0.0 and every bundled surface crashed on serve with
    # `'Server' object has no attribute 'list_tools'`. Cap here until we migrate to 2.x.
    "mcp[cli]>=1.28.1,<2",
    "uvicorn>=0.49.0",
    # Gecko-key gate (Layer 1): PrivyAccountResolver verifies a Privy access-token JWT
    # against Privy's JWKS (RS256/ES256), so the hosted serve path needs PyJWT + the
    # `crypto` extra (cryptography). Only imported when the gate is on + Privy configured;
    # a plain `gecko add` never touches it, so it stays out of the base deps.
    "pyjwt[crypto]>=2.10",
]
# Back-compat alias only. `keyring` moved to BASE dependencies (decision #4), so this
# extra is now EMPTY — `gecko-surf[credentials]` still resolves (never errors) for anyone
# who pins it, but installs nothing extra.
credentials = []
# Usage-event sink (gecko.events -> gecko_events.surf_events). Optional: absent =>
# gecko.events is a no-op, so a plain OSS install never needs it and never phones
# home. Only our hosted surface (which sets MONGODB_URI) installs this extra.
events = [
    "pymongo>=4.9",
]
# The SOS Venezuela Telegram bot example (examples/sos_vzla_bot). Needed only to
# RUN the bot live; the recorded test path needs only the engine (Pattern B).
sosbot = [
    "anthropic>=0.40",
    "openai>=1.40",
    "python-telegram-bot>=21",
]
# The dense retrieval arm (V2): MongoDB Atlas $vectorSearch (native Voyage autoEmbed)
# + Haiku enrichment. OPTIONAL — the core engine stays dep-light (pyyaml only). The
# provider SDKs live BEHIND injected seams (Enricher/DenseIndex); catalog.py never
# imports them (invariant #2). Pinned blurbs make enrichment a committed-data step,
# so an offline run needs neither key.
dense = [
    "pymongo>=4.10",
    "certifi>=2024.0",
    "anthropic>=0.40",
]
# The agent-in-the-loop FCC eval (scripts/fcc_eval.py + gecko.fcc_eval). Haiku does the
# tool pick+emit; the anthropic SDK is injected behind the LLM seam — the harness module
# imports nothing provider-specific, only the runner constructs the client. OPTIONAL.
fcc = [
    "anthropic>=0.40",
]
# Skill Guard L2 deep metadata (gecko.imagescan.extract_pillow_metadata): Pillow reads
# EXIF/XMP/IPTC/ICC beyond the stdlib PNG/JPEG chunk walk. OPTIONAL — absent => that
# function returns [] and the stdlib L2 path is unchanged. No new BASE dependency.
imagescan = [
    "Pillow>=10.0",
]
# Skill Guard L3 OCR (gecko.imagescan.ocr_text): read a payload rendered as visible
# PIXELS (the flagship GhostCommit attack) via pytesseract + the tesseract binary.
# OPTIONAL and lazy-imported — absent => ocr_text returns "" and only L1/L2 run. The
# tesseract SYSTEM binary is a separate install (apt/brew); the extra pulls only the
# Python bindings. No new BASE dependency.
ocr = [
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
]
# The Program Surface — PDA derivation (gecko.pda.derive_pda). find_program_address
# needs ed25519 curve math to reject on-curve candidates, so it uses solders behind
# this extra. OPTIONAL and lazy-imported — absent => derive_pda raises a clear
# install hint, and the pda MODEL + (Phase 1) extraction stay pure stdlib. solders is
# already used by scripts/subscribe.py; this makes it a first-class, pinned surface.
solana = [
    "solders>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gecko"]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=8.0",
    "ruff>=0.15.20",
    "types-pyyaml>=6.0.12.20260518",
    # The [solana] extra, in dev so the PDA-derivation tests (tests/test_pda.py)
    # run in the default `uv run pytest` lane against real mainnet ground truth.
    "solders>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"

# The serve transport (mcp/starlette/uvicorn), the sosbot example (anthropic/telegram),
# and the non-CI red-team LLM lane (gecko.redteam.llm) are OPTIONAL. Keep mypy clean
# whether or not they are present — the engine itself stays dep-light.
# PIL/pytesseract are the OPTIONAL Skill Guard image extras ([imagescan] / [ocr]),
# lazy-imported inside gecko.imagescan; keep mypy clean whether or not they resolve.
[[tool.mypy.overrides]]
module = ["mcp.*", "starlette.*", "uvicorn", "uvicorn.*", "anthropic.*", "telegram.*", "openai.*", "pymongo", "pymongo.*", "keyring", "keyring.*", "certifi", "certifi.*", "gecko.redteam.llm", "PIL", "PIL.*", "pytesseract", "pytesseract.*", "solders", "solders.*"]
ignore_missing_imports = true
